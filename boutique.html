<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique</title>
<style>
:root{--c:#1F2A6B;--ct:#fff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#F6F7FB;color:#14162B;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--c);color:var(--ct);padding:32px 16px}
header div,main,footer{max-width:960px;margin:auto}
h1{margin:0;font-size:clamp(1.8rem,7vw,2.8rem)}
header p{margin:6px 0 0;opacity:.9}
main{padding:16px}
.m{color:#5B607A;font-size:.9rem}
input,select{font:inherit;width:100%;padding:11px 12px;border:2px solid #DADDEA;border-radius:12px;background:#fff;color:#14162B}
label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:12px}
.card,.panel{background:#fff;border:1px solid #DADDEA;border-radius:18px;overflow:hidden}
.panel{padding:18px;max-width:560px;margin-top:16px}
.pic{height:200px;display:grid;place-items:center;font-size:3.2rem;background:#DADDEA}
.pic img{width:100%;height:100%;object-fit:contain}
.bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px}
.price{font-weight:800;color:#1E8E5A}
.btn{border:0;background:var(--c);color:var(--ct);font:700 15px inherit;padding:10px 16px;border-radius:12px;cursor:pointer}
.ln{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #DADDEA}
.ln b{display:block}.ln button{width:30px;height:30px;border-radius:8px;border:2px solid #DADDEA;background:#fff;font-weight:700}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.2rem;padding:12px 0}
.ok{background:#1E8E5A;color:#fff;border-radius:14px;padding:14px;margin-top:12px}
footer{padding:24px 16px;text-align:center}footer a{color:inherit}
</style>
</head>
<body>
<header><div><h1 id="sn">Chargement…</h1><p id="stg"></p></div></header>
<main>
<div id="nf" hidden><p>Boutique introuvable.</p><p><a href="/">Voir toutes les boutiques</a></p></div>
<div id="shop" hidden>
<input id="q" type="search" placeholder="Chercher un produit…" aria-label="Chercher">
<div class="grid" id="grid"></div>
<div class="panel" id="cp" hidden>
<h2 style="margin:0">Ton panier</h2>
<div id="lines"></div>
<div class="tot"><span>Total</span><span id="tot"></span></div>
<label for="bn">Ton nom</label><input id="bn">
<label for="bp">Téléphone</label><input id="bp" type="tel">
<label for="ba">Adresse de livraison</label><input id="ba">
<label for="pay">Paiement</label>
<select id="pay"><option>Wave</option><option>Orange Money</option><option>Paiement à la livraison</option></select>
<p class="m" id="cm" role="alert"></p>
<button class="btn" id="go">Commander</button>
</div>
<div id="done"></div>
</div>
</main>
<footer class="m">Boutique propulsée par <a href="/">Sunu Marché</a></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB_URL="https://odmkeeiwlaetrikmyhbk.supabase.co",SB_KEY="sb_publishable_jWB5zwgGyI96zLaJ1RmG2Q_UmOxmuo6";
var WA="221781498148",WAVE="78 149 81 48",OM="78 149 81 48";
var db=supabase.createClient(SB_URL,SB_KEY),$=function(i){return document.getElementById(i)};
var store=null,items=[],cart={};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fc(n){return Number(n).toLocaleString("fr-FR")+" FCFA"}
function lum(h){return(0.299*parseInt(h.substr(1,2),16)+0.587*parseInt(h.substr(3,2),16)+0.114*parseInt(h.substr(5,2),16))/255}
async function init(){
var slug=(new URLSearchParams(location.search).get("b")||"").toLowerCase();
var r=slug?await db.from("stores").select("*").eq("slug",slug).maybeSingle():{};
if(!r.data){$("sn").textContent="Boutique introuvable";$("nf").hidden=false;return}
store=r.data;document.title=store.name;
$("sn").textContent=store.name;$("stg").textContent=store.tagline||"";
document.documentElement.style.setProperty("--c",store.color);
document.documentElement.style.setProperty("--ct",lum(store.color)>0.6?"#14162B":"#fff");
var p=await db.from("products").select("*").eq("seller_id",store.id).eq("status","approved").order("created_at",{ascending:false});
items=p.data||[];$("shop").hidden=false;render();drawCart()}
function render(){
var q=$("q").value.toLowerCase();
var l=items.filter(function(x){return(x.name+" "+(x.description||"")).toLowerCase().indexOf(q)>-1});
$("grid").innerHTML=l.length?l.map(function(x){return'<article class="card"><div class="pic">'+(x.image_url?'<img src="'+esc(x.image_url)+'" alt="'+esc(x.name)+'" loading="lazy">':esc(x.emoji||"🎁"))+'</div><div class="bd"><b>'+esc(x.name)+'</b><div class="m">'+esc(x.description)+'</div><div class="row"><span class="price">'+fc(x.price)+'</span><button class="btn" data-add="'+x.id+'">Ajouter</button></div></div></article>'}).join(""):'<p class="m">Cette boutique n’a pas encore de produits.</p>'}
$("q").oninput=render;
$("grid").onclick=function(e){var b=e.target.closest("[data-add]");if(!b)return;var id=b.dataset.add;cart[id]=(cart[id]||0)+1;b.textContent="Ajouté ✓";setTimeout(function(){b.textContent="Ajouter"},900);drawCart()};
function drawCart(){
var ids=Object.keys(cart),t=0;
$("lines").innerHTML=ids.map(function(id){var x=items.find(function(i){return i.id==id});t+=x.price*cart[id];
return'<div class="ln"><div><b>'+esc(x.name)+'</b><span class="m">'+fc(x.price)+'</span></div><div><button data-m="'+id+'">−</button> '+cart[id]+' <button data-p="'+id+'">+</button></div></div>'}).join("");
$("tot").textContent=fc(t);$("cp").hidden=!ids.length}
$("lines").onclick=function(e){var b=e.target.closest("button");if(!b)return;var id=b.dataset.m||b.dataset.p;cart[id]+=b.dataset.p?1:-1;if(cart[id]<1)delete cart[id];drawCart()};
$("go").onclick=async function(){
var nm=$("bn").value.trim(),ph=$("bp").value.trim(),ad=$("ba").value.trim();
if(!nm||!ph||!ad){$("cm").textContent="Remplis ton nom, ton téléphone et ton adresse.";return}
var ids=Object.keys(cart),t=0,its=[],lt=[];
ids.forEach(function(id){var x=items.find(function(i){return i.id==id});t+=x.price*cart[id];its.push({id:x.id,name:x.name,qty:cart[id],price:x.price});lt.push(cart[id]+" × "+x.name)});
var pay=$("pay").value;this.disabled=true;
var r=await db.from("orders").insert({buyer_name:nm,buyer_phone:ph,address:ad,payment:pay,items:its,total:t,store_id:store.id});
this.disabled=false;
if(r.error){$("cm").textContent="Commande impossible. Réessaie dans un instant.";return}
$("cm").textContent="";
var m="Bonjour, commande boutique "+store.name+" : "+lt.join(", ")+". Total : "+fc(t)+". Livraison : "+ad+". Paiement : "+pay+". Nom : "+nm+", tél : "+ph;
var num=pay==="Wave"?WAVE:OM;
$("done").innerHTML='<div class="ok"><b>Commande enregistrée, merci '+esc(nm)+' !</b><br>'+(pay==="Paiement à la livraison"?"Tu paieras à la réception.":"Envoie "+fc(t)+" par "+esc(pay)+" au "+esc(num)+".")+' Puis confirme sur WhatsApp.</div><p><a class="btn" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/'+WA+'?text='+encodeURIComponent(m)+'">Confirmer sur WhatsApp</a></p>';
cart={};drawCart()};
init();
</script>
</body>
</html>
<style>.pic{overflow:hidden}.pic img{height:200px}</style>
